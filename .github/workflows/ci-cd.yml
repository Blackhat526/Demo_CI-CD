jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: login-form   # 👈 ADD THIS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build